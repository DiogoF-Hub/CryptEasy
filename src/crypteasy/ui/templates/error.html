{% extends "base.html" %}
{% block title %}{{ t('error.title') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{% if code == 403 %}{{ t('error.forbidden_title') }}{% else %}{{ t('error.title') }}{% endif %}</h1>
  <div class="alert alert-error" role="alert">{{ message }}</div>
  {% if code != 403 %}<a class="btn" href="{{ url_for('home.index') }}">{{ t('common.back_home') }}</a>{% endif %}
</section>
{% endblock %}
