# Lint (Ruff) and tests on every PR, and on every push to main or a personal *-dev branch
# (tests on Windows + Linux).
# On a push to main that changes `version` in pyproject.toml (e.g. `uv version --bump patch`):
#   1. builds the one-file executable per OS,
#   2. publishes a GitHub Release tagged v<version> with both executables and SHA256SUMS.
# Each `run:` mirrors a Makefile target (named in the step); keep them in sync.
# Third-party actions are pinned to full commit SHAs (GitHub "Secure use reference").

name: CI

on:
  push:
    branches: [main, "*-dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: a cancelled run could drop a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (make install)
        run: uv sync --locked

      - name: Lint (make lint)
        run: uv run ruff check --output-format=github .

      - name: Check formatting (make lint)
        run: uv run ruff format --check .

  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (make install)
        run: uv sync --locked

      - name: Run tests (make test)
        run: uv run pytest -m "not slow"

  version:
    name: Detect version bump
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the pre-push commit to compare against
          persist-credentials: false

      - name: Compare project.version with the commit before the push
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version_of() { python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])'; }
          new=$(version_of < pyproject.toml)
          # Normalized PEP 440 public version, as written by `uv version` (e.g. 1.2.3, 1.0.0rc1, 0.2.0.dev0).
          # Also guarantees the value is safe to use in tag and file names.
          if ! [[ "$new" =~ ^[0-9]+(\.[0-9]+)*((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "::error::project.version '$new' is not a normalized PEP 440 version"
            exit 1
          fi
          old=""
          if git cat-file -e "$BEFORE:pyproject.toml" 2>/dev/null; then
            old=$(git show "$BEFORE:pyproject.toml" | version_of)
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [[ "$new" =~ (a|b|rc)[0-9]+|\.dev[0-9]+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$old" ] && [ "$old" != "$new" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version bump: $old -> $new, building and releasing v$new"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No version bump (${old:-unknown} -> $new), skipping build and release"
          fi

  build:
    name: Build executable (${{ matrix.os }})
    needs: [lint, test, version]
    if: needs.version.outputs.bumped == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: PyInstaller output only runs on systems with the build host's glibc or newer,
          # so build on the oldest available runner instead of ubuntu-latest.
          - os: ubuntu-22.04 # verify this (ubuntu-22.04 deprecation date)
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install Python (from .python-version)
        run: uv python install

      - name: Install dependencies (make install)
        run: uv sync --locked

      - name: Build executable (make build)
        run: uv run pyinstaller --noconfirm --clean packaging/crypteasy.spec

      - name: Smoke-test executable (make smoke)
        run: uv run python packaging/smoke_test.py

      # Artifacts lose the executable bit (download-artifact README), so the Linux binary
      # is shipped inside a tar.gz, which preserves it.
      - name: Package release asset
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/crypteasy.exe "release/crypteasy-$VERSION-$PLATFORM.exe"
          else
            tar -czf "release/crypteasy-$VERSION-$PLATFORM.tar.gz" -C dist crypteasy
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crypteasy-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: needs.version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and the release; only this job gets write access
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: crypteasy-${{ needs.version.outputs.version }}-*
          path: release
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: release
        run: sha256sum crypteasy-* > SHA256SUMS && cat SHA256SUMS

      - name: Create release v<version>
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # An existing tag would be reused as-is (gh ignores --target then), attaching these
          # binaries to a different commit. Refuse instead.
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag v$VERSION already exists; bump to a new version instead"
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CryptEasy $VERSION" \
            --generate-notes \
            "${flags[@]}"
